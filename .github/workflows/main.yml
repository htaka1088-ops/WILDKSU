name: Build Flourite Kernel

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      feature_set:
        description: 'Feature set'
        type: choice
        required: true
        default: 'KSUN+SUSFS+BBG+NET+NOMOUNT'
        options:
          - KSUN+SUSFS+BBG+NET+NOMOUNT
          - KSUN+SUSFS+BBG+NET
          - KSUN+SUSFS+BBG+NOMOUNT
          - KSUN+SUSFS+NOMOUNT
          - KSUN+SUSFS+NET
          - KSUN+SUSFS+BBG
          - KSUN+SUSFS
          - KSUN+BBG
          - KSUN+NET
          - KSUN
          - SUSFS
          - BBG
          - NET
          - NOMOUNT
          - DS
          - NTSYNC
          - PERF
          - ALL
          - NONE
      ksu_branch:
        description: 'KernelSU-Next branch or commit (default: dev-susfs)'
        required: false
        type: string
        default: 'dev-susfs'
      susfs_ref:
        description: 'SUSFS ref (default: gki-android14-6.1)'
        required: false
        type: string
        default: 'gki-android14-6.1'
      build_jobs:
        description: 'Parallel jobs (0 = nproc)'
        required: false
        type: string
        default: '0'
      lto:
        description: 'LTO mode'
        required: true
        type: choice
        default: 'thin'
        options:
          - thin
          - none
          - full

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      feature_set: ${{ inputs.feature_set }}
      ksu_branch: ${{ inputs.ksu_branch }}
      susfs_ref: ${{ inputs.susfs_ref }}
      build_jobs: ${{ inputs.build_jobs }}
      lto: ${{ inputs.lto }}
    secrets: inherit
