name: Build Flourite Kernel

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      feature_set:
        description: "Feature Set"
        type: choice
        options:
          - FULL
          - KSUN+SUSFS+BBG+NET+NOMOUNT
          - KSUN+SUSFS+BBG+NET
          - KSUN+SUSFS+BBG
          - KSUN+SUSFS+NOMOUNT
          - KSUN+SUSFS
          - KSUN
          - SUSFS
          - NONE
        default: FULL
      ksu_branch:
        description: "pershoot KernelSU-Next branch or commit"
        type: string
        required: false
        default: "dev-susfs"
      susfs_commit:
        description: "SUSFS commit (empty = latest)"
        type: string
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout .github repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "*llvm* google-chrome-stable firefox"

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment

      - name: Download Flourite kernel
        uses: ./.github/actions/download-kernel
        with:
          repository: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
          branch: flourite-v-oss

      - name: Set build timestamp
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=1747814754" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Wed May 21 08:05:54 UTC 2025" >> "$GITHUB_ENV"
          echo "GIT_AUTHOR_DATE=2025-05-21T08:05:54Z" >> "$GITHUB_ENV"
          echo "GIT_COMMITTER_DATE=2025-05-21T08:05:54Z" >> "$GITHUB_ENV"

      - name: KernelSU-Next
        if: ${{ inputs.feature_set == 'FULL' || contains(format('+{0}+', inputs.feature_set), '+KSUN+') }}
        uses: ./.github/actions/kernelsu
        with:
          ksu_branch: ${{ inputs.ksu_branch }}

      - name: SUSFS
        if: ${{ inputs.feature_set == 'FULL' || contains(format('+{0}+', inputs.feature_set), '+SUSFS+') }}
        uses: ./.github/actions/susfs
        with:
          susfs_commit: ${{ inputs.susfs_commit }}
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          os_patch_level: "flourite"
          sublevel: "68"

      - name: Baseband Guard
        if: ${{ inputs.feature_set == 'FULL' || contains(format('+{0}+', inputs.feature_set), '+BBG+') }}
        uses: ./.github/actions/bbg
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "68"
          os_patch_level: "flourite"

      - name: NoMount
        if: ${{ inputs.feature_set == 'FULL' || contains(format('+{0}+', inputs.feature_set), '+NOMOUNT+') }}
        uses: ./.github/actions/nomount
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "68"
          os_patch_level: "flourite"

      - name: Setup Networking
        if: ${{ inputs.feature_set == 'FULL' || contains(format('+{0}+', inputs.feature_set), '+NET+') }}
        uses: ./.github/actions/networking
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "68"

      - name: DroidSpaces
        if: ${{ inputs.feature_set == 'FULL' || contains(format('+{0}+', inputs.feature_set), '+DS+') }}
        uses: ./.github/actions/droidspaces
        with:
          version: android14-6.1
          kernel_version: "6.1"

      - name: NTSync
        uses: ./.github/actions/ntsync
        with:
          version: android14-6.1
          kernel_version: "6.1"
          sublevel: "68"

      - name: Ptrace
        uses: ./.github/actions/ptrace
        with:
          kernel_version: "6.1"

      - name: Unicode fix
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: "6.1"

      - name: Misc configs
        uses: ./.github/actions/misc

      - name: BTF
        uses: ./.github/actions/btf
        with:
          version: android14-6.1
          kernel_version: "6.1"
          sublevel: "68"

      - name: Device patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: android14-6.1
          kernel_version: "6.1"

      - name: Kernel branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: Normal
          kernel_version: "6.1"
          android_version: android14
          version: android14-6.1
          sublevel: "68"

      - name: Clean kernel flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Build
        uses: ./.github/actions/build-kernel
        with:
          config: flourite_GKI.config

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "${GITHUB_WORKSPACE}/AnyKernel3" ]; then
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "${GITHUB_WORKSPACE}/AnyKernel3/.git-source"
            rm -rf "${GITHUB_WORKSPACE}/AnyKernel3/.git-source/.git"
            find "${GITHUB_WORKSPACE}/AnyKernel3/.git-source" -mindepth 1 -maxdepth 1 ! -name '.git-source' -exec cp -a {} "${GITHUB_WORKSPACE}/AnyKernel3/" \; || true
            rm -rf "${GITHUB_WORKSPACE}/AnyKernel3/.git-source"
          fi
          cd "${GITHUB_WORKSPACE}"
          zip -r -9 flourite-kernel.zip AnyKernel3 >/dev/null

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: flourite-kernel
          path: |
            flourite-kernel.zip
            AnyKernel3/**
          if-no-files-found: error
          compression-level: 9
