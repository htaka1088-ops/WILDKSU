name: Build Flourite Kernel

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      resukisu_ref:
        description: "ReSukiSU branch/tag/commit"
        required: false
        type: string
        default: "main"
      enable_susfs:
        description: "Enable SUSFS"
        required: false
        type: boolean
        default: true
      enable_zram:
        description: "Enable Flourite ZRAM enhancements"
        required: false
        type: boolean
        default: false
      enable_bbg:
        description: "Enable Baseband Guard"
        required: false
        type: boolean
        default: false
      enable_rekernel:
        description: "Enable Re-Kernel"
        required: false
        type: boolean
        default: false
      enable_droidspaces:
        description: "Enable DroidSpaces/NTSync patches"
        required: false
        type: boolean
        default: false
      build_bypass:
        description: "Build a second Bypass Image"
        required: false
        type: boolean
        default: false
      build_time:
        description: "UTC build timestamp; leave N for current time"
        required: false
        type: string
        default: "N"

permissions:
  contents: read

jobs:
  build:
    name: Flourite 6.1
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
      KERNEL_BRANCH: flourite-v-oss
      KERNEL_DIR: ${{ github.workspace }}/kernel
      OUT_DIR: ${{ github.workspace }}/kernel/out
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: gki-android14-6.1
      RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-*"
          remove_packages_one_command: true
          testing: false

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang-18 curl flex \
            libelf-dev libssl-dev lld-18 llvm-18 pahole \
            python3 python3-pip rsync unzip zip git wget \
            device-tree-compiler

      - name: Configure compiler
        run: |
          set -euxo pipefail
          echo "PATH=/usr/lib/llvm-18/bin:$PATH" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"
          clang --version
          ld.lld --version

      - name: Clone ONLY Xiaomi Flourite kernel source
        run: |
          set -euxo pipefail
          rm -rf "$KERNEL_DIR"
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"
          cd "$KERNEL_DIR"

          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KERNEL_VERSION=$(make -s kernelversion)" >> "$GITHUB_ENV"

          test -f Makefile
          test -f arch/arm64/configs/vendor/flourite_GKI.config
          test -d drivers
          test -d arch/arm64

          echo "Kernel source: $KERNEL_REPO"
          echo "Kernel branch: $KERNEL_BRANCH"
          echo "Kernel commit: $(git rev-parse HEAD)"
          echo "Kernel version: $(make -s kernelversion)"

      - name: Prepare clean kernel tree
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          # This removes generated files only; the cloned Xiaomi source remains the
          # only kernel source tree used by the build.
          make ARCH=arm64 mrproper
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

      - name: Add ReSukiSU
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          echo "Installing ReSukiSU ref: ${{ inputs.resukisu_ref }}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            | bash -s -- "${{ inputs.resukisu_ref }}"

          test -d KernelSU/kernel
          test -L drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

          echo "RESUKISU_COMMIT=$(git -C KernelSU rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RESUKISU_TAG=$(git -C KernelSU describe --tags --always 2>/dev/null || true)" >> "$GITHUB_ENV"

      - name: Clone SUSFS
        if: inputs.enable_susfs
        run: |
          set -euxo pipefail
          rm -rf "$GITHUB_WORKSPACE/susfs4ksu"
          git clone --depth=1 --branch "$SUSFS_BRANCH" "$SUSFS_REPO" "$GITHUB_WORKSPACE/susfs4ksu"
          test -f "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
          test -f "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

      - name: Apply SUSFS to Flourite tree
        if: inputs.enable_susfs
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail

          # ReSukiSU already supplies the KSU integration. The SUSFS kernel tree
          # changes are applied directly to the Xiaomi source root, not to an ACK
          # "common/" tree.
          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/"* fs/
          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/"* include/linux/

          SUSFS_PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"

          if patch --dry-run -p1 --forward < "$SUSFS_PATCH" >/tmp/susfs-dryrun.log 2>&1; then
            patch -p1 --forward < "$SUSFS_PATCH"
          else
            cat /tmp/susfs-dryrun.log
            echo "::error::The stock SUSFS 6.1 patch does not cleanly apply to Xiaomi flourite-v-oss."
            echo "A source-specific SUSFS patch is required; the workflow will not silently ignore it."
            exit 1
          fi

          # ReSukiSU's kernel contains the KSU/SUSFS integration path, so do not
          # apply the official-KernelSU-only 10_enable_susfs_for_ksu.patch here.
          test -f fs/susfs.c
          test -f include/linux/susfs.h || test -f include/linux/susfs_def.h

      - name: Apply optional ZRAM enhancement
        if: inputs.enable_zram
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          if [ -f "$GITHUB_WORKSPACE/zram/apply_lz4_neon.sh" ]; then
            cp -r "$GITHUB_WORKSPACE/zram/lz4/"* lib/lz4/
            cp -r "$GITHUB_WORKSPACE/zram/include/linux/"* include/linux/
            bash "$GITHUB_WORKSPACE/zram/apply_lz4_neon.sh"
          fi

      - name: Apply optional Baseband Guard
        if: inputs.enable_bbg
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          wget -qO- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          grep -q 'CONFIG_BBG' arch/arm64/configs/vendor/flourite_GKI.config || \
            echo 'CONFIG_BBG=y' >> arch/arm64/configs/vendor/flourite_GKI.config

      - name: Apply optional Re-Kernel
        if: inputs.enable_rekernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          git clone --depth=1 https://github.com/Sakion-Team/Re-Kernel.git "$tmp/Re-Kernel"
          mkdir -p drivers/rekernel
          cp "$tmp/Re-Kernel/LKM-Source/rekernel.c" drivers/rekernel/
          cp "$tmp/Re-Kernel/LKM-Source/rekernel.h" drivers/rekernel/
          cat > drivers/rekernel/Kconfig <<'EOF'
          menu "Re:Kernel"
          config REKERNEL
            tristate "Re:Kernel driver"
            default y
          endmenu
          EOF
          printf '\nobj-$(CONFIG_REKERNEL) += rekernel/\n' >> drivers/Makefile
          printf '\nsource "drivers/rekernel/Kconfig"\n' >> drivers/Kconfig
          echo 'CONFIG_REKERNEL=y' >> arch/arm64/configs/vendor/flourite_GKI.config

      - name: Apply optional DroidSpaces NTSync
        if: inputs.enable_droidspaces
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/Goldzxcbug/Droidspaces_Kernel_patch.git /tmp/droidspaces
          test -f /tmp/droidspaces/NTsync/ntsync_base.patch
          patch --dry-run -p1 --forward < /tmp/droidspaces/NTsync/ntsync_base.patch
          patch -p1 --forward < /tmp/droidspaces/NTsync/ntsync_base.patch
          if [ -f /tmp/droidspaces/NTsync/ntsync_6.1.patch ]; then
            patch --dry-run -p1 --forward < /tmp/droidspaces/NTsync/ntsync_6.1.patch
            patch -p1 --forward < /tmp/droidspaces/NTsync/ntsync_6.1.patch
          fi
          echo 'CONFIG_NTSYNC=y' >> arch/arm64/configs/vendor/flourite_GKI.config

      - name: Build Flourite configuration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail

          # Start from the kernel's own generic ARM64 defconfig, then merge
          # Xiaomi's Flourite-specific config fragment.
          make O="$OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          "$KERNEL_DIR/scripts/kconfig/merge_config.sh" \
            -m -O "$OUT_DIR" \
            "$OUT_DIR/.config" \
            "$KERNEL_DIR/arch/arm64/configs/vendor/flourite_GKI.config"

          # KSU/SUSFS are enabled in the generated output config, never by
          # editing the source .config (there is no source-tree .config).
          scripts/config --file "$OUT_DIR/.config" --enable CONFIG_KSU

          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            scripts/config --file "$OUT_DIR/.config" \
              --enable CONFIG_KSU_SUSFS \
              --enable CONFIG_KSU_SUSFS_SUS_PATH \
              --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
              --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
              --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
              --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
              --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
              --enable CONFIG_KSU_SUSFS_SUS_MAP \
              --disable CONFIG_KSU_SUSFS_SUS_SU
          fi

          make O="$OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          cp "$OUT_DIR/.config" "$GITHUB_WORKSPACE/kernel.config"

          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_MI_|CONFIG_QCOM_)' \
            "$OUT_DIR/.config" | head -n 120 || true

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail

          if [ "${{ inputs.build_time }}" = "N" ] || [ -z "${{ inputs.build_time }}" ]; then
            export KBUILD_BUILD_TIMESTAMP="$(date -u '+%a %b %d %T UTC %Y')"
          else
            export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_time }}"
          fi
          export KBUILD_BUILD_USER=GitHub
          export KBUILD_BUILD_HOST=Actions

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="clang" \
            LD="ld.lld" \
            Image modules dtbs

          test -s "$OUT_DIR/arch/arm64/boot/Image"
          strings "$OUT_DIR/arch/arm64/boot/Image" | grep -m1 'Linux version' || true

      - name: Build Bypass kernel
        if: inputs.build_bypass
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          cp "$OUT_DIR/.config" /tmp/flourite-normal.config
          target="kernel/module/internal.c"
          if [ ! -f "$target" ]; then
            target="kernel/module.c"
          fi
          if grep -q 'bad_version:' "$target"; then
            sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$target"
          else
            echo "::error::Could not locate bad_version module check"
            exit 1
          fi
          rm -rf "$OUT_DIR-bypass"
          make O="$OUT_DIR-bypass" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j"$(nproc)" O="$OUT_DIR-bypass" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld Image modules dtbs
          cp "$OUT_DIR-bypass/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/Bypass-Image"

      - name: Prepare AnyKernel3
        run: |
          set -euxo pipefail
          rm -rf "$GITHUB_WORKSPACE/AnyKernel3"
          git clone --depth=1 https://github.com/ReSukiSU-GKI/AnyKernel3.git \
            "$GITHUB_WORKSPACE/AnyKernel3"
          rm -rf "$GITHUB_WORKSPACE/AnyKernel3/.git"
          cp "$OUT_DIR/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/AnyKernel3/Image"
          cp "$GITHUB_WORKSPACE/kernel.config" "$GITHUB_WORKSPACE/AnyKernel3/kernel.config"

          if [ -f "$GITHUB_WORKSPACE/Bypass-Image" ]; then
            cp "$GITHUB_WORKSPACE/Bypass-Image" "$GITHUB_WORKSPACE/AnyKernel3/Bypass-Image"
          fi

      - name: Package artifacts
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/AnyKernel3"
          zip -r -9 "$GITHUB_WORKSPACE/Flourite-ReSukiSU-AnyKernel3.zip" . \
            -x '*.git*'

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$OUT_DIR/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/dist/Image"
          cp "$GITHUB_WORKSPACE/kernel.config" "$GITHUB_WORKSPACE/dist/kernel.config"
          cp "$OUT_DIR/System.map" "$GITHUB_WORKSPACE/dist/System.map"
          cp "$OUT_DIR/.config" "$GITHUB_WORKSPACE/dist/.config"

          tar -C "$OUT_DIR" -czf "$GITHUB_WORKSPACE/dist/modules.tar.gz" \
            lib/modules 2>/dev/null || true

          cat > "$GITHUB_WORKSPACE/dist/build-info.txt" <<EOF
          Kernel source: $KERNEL_REPO
          Kernel branch: $KERNEL_BRANCH
          Kernel commit: $KERNEL_COMMIT
          Kernel version: $KERNEL_VERSION
          ReSukiSU repository: $RESUKISU_REPO
          ReSukiSU ref: ${{ inputs.resukisu_ref }}
          ReSukiSU commit: ${RESUKISU_COMMIT:-unknown}
          ReSukiSU tag: ${RESUKISU_TAG:-unknown}
          SUSFS enabled: ${{ inputs.enable_susfs }}
          SUSFS branch: $SUSFS_BRANCH
          LLVM: $(clang --version | head -n1)
          EOF

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flourite-ReSukiSU-${{ env.KERNEL_VERSION }}
          path: |
            Flourite-ReSukiSU-AnyKernel3.zip
            dist/
          compression-level: 0
