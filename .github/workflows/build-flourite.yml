name: Flourite Kernel Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KERNEL_SOURCE_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  KERNEL_SOURCE_BRANCH: flourite-v-oss

on:
  workflow_call:
    inputs:
      kernelsu_branch: { required: true, type: string }
      susfs_branch: { required: true, type: string }
      version: { required: false, type: string, default: "" }
      build_time: { required: false, type: string, default: "" }
      clean_build: { required: false, type: boolean, default: false }
      use_zram: { required: false, type: boolean, default: false }
      use_bbg: { required: false, type: boolean, default: false }
      use_rekernel: { required: false, type: boolean, default: false }
      cve_2026_43499_patch: { required: false, type: boolean, default: true }
      droidspaces: { required: false, type: string, default: off }
      droidspaces_ntsync: { required: false, type: boolean, default: false }
      build_bypass: { required: false, type: boolean, default: false }

jobs:
  build:
    name: Flourite 6.1.x · ReSukiSU/SUSFS
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ARCH: arm64
      O: ${{ github.workspace }}/out
      KERNEL_DIR: ${{ github.workspace }}/kernel
      LLVM: 1
      LLVM_IAS: 1
      CROSS_COMPILE: aarch64-linux-gnu-
      CC: clang

    steps:
      - name: Generate Flourite kernel config
  working-directory: ${{ env.KERNEL_DIR }}
  run: |
    set -euxo pipefail

    test -f arch/arm64/configs/gki_defconfig
    test -f arch/arm64/configs/vendor/flourite_GKI.config

    # The public Flourite OSS tree references drivers/misc/hwid/Kconfig
    # from drivers/misc/Kconfig, but that HWID directory is absent from
    # the published source. Remove only that dangling Kconfig include;
    # do not create a fake HWID driver.
    if grep -Fq 'source "drivers/misc/hwid/Kconfig"' drivers/misc/Kconfig; then
      test ! -f drivers/misc/hwid/Kconfig
      cp drivers/misc/Kconfig "$O.drivers-misc-Kconfig.orig"
      sed -i '\|source "drivers/misc/hwid/Kconfig"|d' drivers/misc/Kconfig
    fi

    # Generate the base config in the external output tree.
    make O="$O" ARCH=arm64 gki_defconfig

    # Apply the device-specific Flourite configuration.
    scripts/kconfig/merge_config.sh -m -r       "$O/.config"       arch/arm64/configs/vendor/flourite_GKI.config

    make O="$O" ARCH=arm64 olddefconfig
    test -f "$O/.config"

    echo "Flourite Kconfig prepared successfully." >> "$GITHUB_STEP_SUMMARY"


      - name: Show source and base configuration
        run: |
          set -euo pipefail
          echo "## Flourite source" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repo: \`$KERNEL_SOURCE_REPO\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`$KERNEL_SOURCE_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$SOURCE_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kernel: \`$KERNEL_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Config: \`flourite_GKI.config\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply CVE-2026-43499 when applicable
        if: ${{ !inputs.clean_build && inputs.cve_2026_43499_patch }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          if [ -x "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" ]; then
            SUB=$(awk '/^SUBLEVEL =/{print $3; exit}' Makefile)
            bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" 6.1 "$SUB" "$GITHUB_WORKSPACE/security_patch" || {
              echo "CVE patch is not compatible with this Flourite tree"
              exit 1
            }
          else
            echo "CVE patch helper not present; skipped"
          fi

      - name: Add ReSukiSU
        if: ${{ !inputs.clean_build }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          REF="${{ inputs.kernelsu_branch }}"
          curl --fail --location --proto '=https' -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/${REF}/kernel/setup.sh" \
            | bash -s "$REF"
          test -d kernel/ksu || test -d KernelSU

      - name: Apply SUSFS for Android 14 6.1
        if: ${{ !inputs.clean_build }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          rm -rf "$GITHUB_WORKSPACE/susfs4ksu"
          git clone --depth=1 --branch "${{ inputs.susfs_branch }}" https://gitlab.com/simonpunk/susfs4ksu.git "$GITHUB_WORKSPACE/susfs4ksu"
          SUSFS="$GITHUB_WORKSPACE/susfs4ksu"
          mkdir -p fs include/linux
          cp -af "$SUSFS/kernel_patches/fs/." fs/
          cp -af "$SUSFS/kernel_patches/include/linux/." include/linux/
          PATCH=""
          for p in \
            "$SUSFS/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch" \
            "$SUSFS/kernel_patches/50_add_susfs_in_kernel-6.1.patch"; do
            if [ -f "$p" ]; then PATCH="$p"; break; fi
          done
          if [ -z "$PATCH" ]; then
            echo "::error::No SUSFS 6.1 patch found in $SUSFS"
            find "$SUSFS/kernel_patches" -maxdepth 1 -type f -print
            exit 1
          fi
          patch -p1 --forward < "$PATCH"
          rm -f "$PATCH"

      - name: Configure ReSukiSU and SUSFS
        if: ${{ !inputs.clean_build }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          scripts/config --file "$O/.config" --enable CONFIG_KSU
          if grep -q '^config KSU_SUSFS' kernel/Kconfig 2>/dev/null || grep -Rqs '^config KSU_SUSFS' kernel include 2>/dev/null; then
            scripts/config --file "$O/.config" --enable CONFIG_KSU_SUSFS || true
          fi
          for c in \
            CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP; do
            scripts/config --file "$O/.config" --enable "$c" || true
          done
          make O="$O" ARCH=arm64 olddefconfig

      - name: Configure optional features
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          if [ "${{ inputs.use_bbg }}" = "true" ] && [ "${{ inputs.clean_build }}" != "true" ]; then
            curl --fail --location --proto '=https' -LSs https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
            scripts/config --file "$O/.config" --enable CONFIG_BBG || true
          fi
          if [ "${{ inputs.use_zram }}" = "true" ] && [ "${{ inputs.clean_build }}" != "true" ]; then
            if [ -x "$GITHUB_WORKSPACE/zram/apply_lz4_neon.sh" ]; then
              cp -af "$GITHUB_WORKSPACE/zram/lz4/." lib/lz4/
              cp -af "$GITHUB_WORKSPACE/zram/include/linux/." include/linux/
              bash "$GITHUB_WORKSPACE/zram/apply_lz4_neon.sh" || true
            fi
          fi
          make O="$O" ARCH=arm64 olddefconfig

      - name: Set build metadata
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.build_time }}" ]; then
            export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_time }}"
          fi
          echo "KBUILD_BUILD_USER=github-actions" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=flourite-builder" >> "$GITHUB_ENV"

      - name: Build Flourite Image and modules
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=flourite-builder
          make O="$O" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image Image.gz Image.lz4 dtbs modules
          test -f "$O/arch/arm64/boot/Image"
          strings "$O/arch/arm64/boot/Image" | grep -m1 'Linux version' || true

      - name: Build optional Bypass Image
        if: ${{ inputs.build_bypass }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          TARGET="kernel/module.c"
          [ -f "$TARGET" ] || TARGET="kernel/module/version.c"
          if [ ! -f "$TARGET" ]; then echo "No module version checker found"; exit 1; fi
          cp "$TARGET" "$TARGET.before-bypass"
          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET"
          make O="$O" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image
          cp "$O/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/Bypass-Image"
          mv "$TARGET.before-bypass" "$TARGET"

      - name: Prepare artifacts
        run: |
          set -euxo pipefail
          mkdir -p package
          cp "$O/arch/arm64/boot/Image" package/Image
          [ ! -f "$O/arch/arm64/boot/Image.gz" ] || cp "$O/arch/arm64/boot/Image.gz" package/Image.gz
          [ ! -f "$O/arch/arm64/boot/Image.lz4" ] || cp "$O/arch/arm64/boot/Image.lz4" package/Image.lz4
          cp "$O/.config" package/kernel.config
          [ ! -f "$O/System.map" ] || cp "$O/System.map" package/System.map
          if [ -f "$GITHUB_WORKSPACE/Bypass-Image" ]; then cp "$GITHUB_WORKSPACE/Bypass-Image" package/Bypass-Image; fi
          cat > package/build-info.txt <<EOF
          SOURCE_REPO=$KERNEL_SOURCE_REPO
          SOURCE_BRANCH=$KERNEL_SOURCE_BRANCH
          SOURCE_COMMIT=$SOURCE_COMMIT
          KERNEL_VERSION=$KERNEL_VERSION
          RESUKISU_BRANCH=${{ inputs.kernelsu_branch }}
          SUSFS_BRANCH=${{ inputs.susfs_branch }}
          EOF

      - name: Create AnyKernel3 package
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/ReSukiSU-GKI/AnyKernel3.git AnyKernel3
          cp package/Image AnyKernel3/Image
          [ ! -f package/Bypass-Image ] || cp package/Bypass-Image AnyKernel3/Bypass-Image
          (cd AnyKernel3 && zip -r -q "$GITHUB_WORKSPACE/Flourite-AnyKernel3.zip" .)
          cp Flourite-AnyKernel3.zip package/

      - name: Collect rejects and upload artifacts
        if: ${{ always() }}
        run: |
          find "$KERNEL_DIR" -type f \( -name '*.rej' -o -name '*.orig' \) -print > package/patch-conflicts.txt || true
          if [ -s package/patch-conflicts.txt ]; then
            tar -czf package/patch-conflicts.tar.gz -T package/patch-conflicts.txt || true
          fi

      - name: Upload Flourite artifacts
        uses: actions/upload-artifact@v6
        with:
          name: flourite-${{ inputs.clean_build && 'clean' || 'resukisu-susfs' }}
          path: package/
          if-no-files-found: error
