name: Build Flourite 6.1

on:
  workflow_call:
    inputs:
      feature_set:
        required: true
        type: string
      ksu_ref:
        required: true
        type: string
      susfs_ref:
        required: true
        type: string
      build_jobs:
        required: true
        type: string
      lto:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout .github
        uses: actions/checkout@v4

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: 'azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* dotnet-sdk-*'
          remove_packages_one_command: true
          testing: false

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache clang flex git libelf-dev liblz4-tool \
            libssl-dev lld llvm pahole python3 rsync unzip zip zstd libncurses-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Clone ONLY Xiaomi Flourite kernel source
        uses: ./.github/actions/kernel-source

      - name: Record source
        working-directory: kernel
        run: |
          set -euxo pipefail
          SOURCE_REPO="https://github.com/MiCode/Xiaomi_Kernel_OpenSource"
          SOURCE_BRANCH="flourite-v-oss"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          KERNEL_VERSION="$(make -s kernelversion)"

          # Export for subsequent GitHub Actions steps. Values written to
          # GITHUB_ENV are not available as shell variables until the next step.
          {
            echo "SOURCE_REPO=$SOURCE_REPO"
            echo "SOURCE_BRANCH=$SOURCE_BRANCH"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
          } >> "$GITHUB_ENV"

          printf '## Source\n\n- Repo: `%s`\n- Branch: `%s`\n- Commit: `%s`\n- Kernel: `%s`\n' \
            "$SOURCE_REPO" "$SOURCE_BRANCH" "$SOURCE_COMMIT" "$KERNEL_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: KernelSU-Next
        if: ${{ contains(inputs.feature_set, 'KSUN') || inputs.feature_set == 'ALL' }}
        uses: ./.github/actions/kernelsu-next
        with:
          ref: ${{ inputs.ksu_ref }}

      - name: SUSFS
        if: ${{ contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'ALL' }}
        uses: ./.github/actions/susfs
        with:
          ref: ${{ inputs.susfs_ref }}

      - name: NoMount
        if: ${{ contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'ALL' }}
        uses: ./.github/actions/nomount

      - name: Baseband Guard
        if: ${{ contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'ALL' }}
        uses: ./.github/actions/bbg

      - name: Networking
        if: ${{ contains(inputs.feature_set, 'NET') || inputs.feature_set == 'ALL' }}
        uses: ./.github/actions/networking

      - name: DroidSpaces
        if: ${{ contains(inputs.feature_set, 'DS') || inputs.feature_set == 'ALL' }}
        uses: ./.github/actions/droidspaces

      - name: NTSync
        if: ${{ contains(inputs.feature_set, 'NTSYNC') || inputs.feature_set == 'ALL' }}
        uses: ./.github/actions/ntsync

      - name: Performance patches
        if: ${{ contains(inputs.feature_set, 'PERF') || inputs.feature_set == 'ALL' }}
        uses: ./.github/actions/performance

      - name: Miscellaneous kernel config
        uses: ./.github/actions/misc

      - name: Apply LTO choice
        working-directory: kernel
        env:
          LTO: ${{ inputs.lto }}
        run: |
          set -euxo pipefail
          case "$LTO" in
            thin)  scripts/config --enable CONFIG_LTO_CLANG --disable CONFIG_LTO_CLANG_FULL --enable CONFIG_LTO_CLANG_THIN ;;
            full)  scripts/config --enable CONFIG_LTO_CLANG --enable CONFIG_LTO_CLANG_FULL --disable CONFIG_LTO_CLANG_THIN ;;
            none)  scripts/config --disable CONFIG_LTO_CLANG --disable CONFIG_LTO_CLANG_FULL --disable CONFIG_LTO_CLANG_THIN ;;
            *) exit 2 ;;
          esac
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        uses: ./.github/actions/build-kernel
        with:
          jobs: ${{ inputs.build_jobs }}

      - name: Package AnyKernel3
        uses: ./.github/actions/package-anykernel3

      - name: Scan patch rejects
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flourite-6.1-${{ github.run_number }}
          path: |
            AnyKernel3/
            build-info/
            patch-rejects/
          if-no-files-found: error
          compression-level: 9

      - name: Build summary
        if: always()
        run: |
          {
            echo ''
            echo '## Build result'
            echo "- Feature set: \\`${{ inputs.feature_set }}\\`"
            echo "- LTO: \\`${{ inputs.lto }}\\`"
            echo "- Source: \\`${SOURCE_REPO}@${SOURCE_COMMIT}\\`"
          } >> "$GITHUB_STEP_SUMMARY"
