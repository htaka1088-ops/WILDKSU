name: Misc config
description: Enable generic kernel options useful to KernelSU/SUSFS
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euxo pipefail
        for cfg in CONFIG_OVERLAY_FS CONFIG_TMPFS_XATTR CONFIG_TMPFS_POSIX_ACL CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_BPF_EVENTS CONFIG_KPROBE_EVENTS CONFIG_UPROBES CONFIG_UPROBE_EVENTS; do scripts/config --enable "$cfg" || true; done
        make O=out ARCH=arm64 olddefconfig
