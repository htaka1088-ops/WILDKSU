name: Performance
description: Apply legacy performance patches only when explicitly verified
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        echo 'Legacy GKI performance patch set is intentionally disabled for Flourite 6.1.'
        echo 'Add a tested Flourite-specific patch before enabling this feature.'
        exit 1
