name: Setup KernelSU-Next (pershoot)
description: Download and configure pershoot KernelSU-Next with SUSFS support
inputs:
  ksu_branch:
    description: 'KernelSU-Next branch or commit (empty = dev-susfs)'
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Download KernelSU-Next from pershoot
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
        KSU_INPUT="${{ inputs.ksu_branch }}"
        if [ -z "$KSU_INPUT" ]; then
          KSU_INPUT="dev-susfs"
        fi

        # The pershoot dev-susfs setup script is the bootstrap used by the
        # original WildKernels workflow. Do not use the official KernelSU-Next
        # next-susfs URL here: it is a different repository/branch layout.
        SETUP_URL="https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh"
        curl --fail --location --proto '=https' -LSs "$SETUP_URL" | bash -s dev-susfs
        test -d KernelSU-Next/kernel

        # Try the requested ref as a branch first; otherwise treat it as a commit.
        if git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
          echo "Using KernelSU-Next branch: $KSU_INPUT"
          git -C KernelSU-Next/kernel fetch --depth=50 origin "$KSU_INPUT"
          git -C KernelSU-Next/kernel checkout "origin/$KSU_INPUT"
        else
          echo "Using KernelSU-Next commit: $KSU_INPUT"
          git -C KernelSU-Next/kernel fetch --depth=50 origin "$KSU_INPUT"
          git -C KernelSU-Next/kernel checkout "$KSU_INPUT"
        fi

        cd KernelSU-Next/kernel

        COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD)
        BASE_VERSION=30000
        KSU_VERSION=$(expr "$COMMITS_COUNT" + "$BASE_VERSION")
        sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild

        KSU_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")"
        sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild

        echo "KSUN_BRANCH=$KSU_INPUT" >> "$GITHUB_ENV"
        echo "KSUN_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"

    - name: Extract KSU Version Info
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail
        BASE_BRANCH=$(git rev-parse --abbrev-ref HEAD | sed 's:-.*::' 2>/dev/null || true)
        BASE_COMMIT=$(git merge-base HEAD "refs/remotes/origin/$BASE_BRANCH" 2>/dev/null || \
          git merge-base HEAD refs/remotes/origin/main 2>/dev/null || echo HEAD)
        KSU_GIT_VERSION=$(git rev-list --count "$BASE_COMMIT" 2>/dev/null || echo 0)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 "$BASE_COMMIT" 2>/dev/null || echo "")
        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION))

        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"

    - name: Fix KernelSU-Next
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail
        cp "${{ github.action_path }}/patches/static.patch" "${{ github.workspace }}/kernel/KernelSU-Next/static.patch"
        patch --dry-run -p1 < static.patch
        patch -p1 < static.patch

    - name: Enable KernelSU config
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        scripts/config --enable CONFIG_KSU
        make O=out ARCH=arm64 olddefconfig
        echo "KernelSU-Next source: https://github.com/pershoot/KernelSU-Next" >> "$GITHUB_STEP_SUMMARY"
        echo "KernelSU-Next ref: ${KSUN_BRANCH:-unknown}" >> "$GITHUB_STEP_SUMMARY"
        echo "KernelSU-Next commit: ${KSUN_COMMIT:-unknown}" >> "$GITHUB_STEP_SUMMARY"
