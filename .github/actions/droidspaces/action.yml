name: DroidSpaces
description: Apply DroidSpaces below-6.12 patch only after a dry-run check
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euxo pipefail
        rm -rf Droidspaces-OSS
        git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git Droidspaces-OSS
        PATCH="Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
        test -f "$PATCH"
        cd kernel
        patch --dry-run -p1 < "../$PATCH"
        patch -p1 < "../$PATCH"
        for cfg in CONFIG_PID_NS CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_DEVTMPFS CONFIG_BINFMT_MISC CONFIG_BINFMT_SCRIPT CONFIG_BINFMT_ELF CONFIG_USER_NS; do scripts/config --enable "$cfg" || true; done
        make O=out ARCH=arm64 olddefconfig
