name: Scan patch rejects
description: Fail on unresolved patch rejects
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        rm -rf patch-rejects
        mkdir -p patch-rejects
        found=0
        while IFS= read -r f; do
          found=1
          cp --parents "$f" patch-rejects/
        done < <(find kernel -type f \( -name '*.rej' -o -name '*.orig' \) -print)
        if [ "$found" = 1 ]; then
          echo '::error::Patch rejects/original files remain in the source tree.'
          find patch-rejects -type f -print
          exit 1
        fi
        echo 'No patch rejects found.'
