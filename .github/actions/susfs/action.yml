name: SUSFS
description: Apply SUSFS 6.1 patches to the Flourite source tree
inputs:
  ref:
    required: true
    default: gki-android14-6.1
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}/kernel
      env:
        SUSFS_REF: ${{ inputs.ref }}
      run: |
        set -euxo pipefail
        rm -rf ../susfs4ksu
        git clone --depth=1 --single-branch --branch "$SUSFS_REF" \
          https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

        # Copy only SUSFS kernel additions into this kernel tree.
        rsync -a ../susfs4ksu/kernel_patches/fs/ fs/
        rsync -a ../susfs4ksu/kernel_patches/include/linux/ include/linux/

        PATCH="../susfs4ksu/kernel_patches/50_add_susfs_in_${SUSFS_REF}.patch"
        if [ ! -f "$PATCH" ]; then
          echo "::error::SUSFS patch not found for $SUSFS_REF: $PATCH"
          exit 1
        fi

        patch --dry-run -p1 < "$PATCH"
        patch -p1 < "$PATCH"

        # KernelSU-Next/SUSFS configs.
        for cfg in \
          CONFIG_KSU_SUSFS \
          CONFIG_KSU_SUSFS_SUS_PATH \
          CONFIG_KSU_SUSFS_SUS_MOUNT \
          CONFIG_KSU_SUSFS_SUS_KSTAT \
          CONFIG_KSU_SUSFS_SPOOF_UNAME \
          CONFIG_KSU_SUSFS_ENABLE_LOG \
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          CONFIG_KSU_SUSFS_OPEN_REDIRECT \
          CONFIG_KSU_SUSFS_SUS_MAP; do
          scripts/config --enable "$cfg"
        done
        make O=out ARCH=arm64 olddefconfig
        grep -E '^CONFIG_KSU(_SUSFS.*)?=y' out/.config | sort | tee -a "$GITHUB_STEP_SUMMARY"
