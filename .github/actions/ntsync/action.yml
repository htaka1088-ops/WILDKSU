name: NTSync
description: Add the upstream ntsync driver when the source tree does not already contain it
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euxo pipefail
        if grep -Rqs 'config NTSYNC' drivers fs; then
          echo 'NTSYNC already present; enabling it.'
          scripts/config --enable CONFIG_NTSYNC
        else
          echo 'NTSYNC is not present in Flourite source; refusing to apply the old GKI compatibility patches.'
          echo '::error::Select a feature set without NTSYNC or add a verified Flourite-specific NTSYNC patch.'
          exit 1
        fi
        make O=out ARCH=arm64 olddefconfig
