name: NoMount
description: Integrate NoMount into a normal kernel source tree
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euxo pipefail
        rm -rf nomount
        git clone --depth=1 https://github.com/maxsteeel/nomount.git nomount
        SRC="nomount/kernel"
        test -d "$SRC"
        rm -rf kernel/fs/nomount
        mkdir -p kernel/fs/nomount
        rsync -a "$SRC"/ kernel/fs/nomount/
        grep -qF 'source "fs/nomount/Kconfig"' kernel/fs/Kconfig || printf '\nsource "fs/nomount/Kconfig"\n' >> kernel/fs/Kconfig
        grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' kernel/fs/Makefile || printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> kernel/fs/Makefile
        scripts/config --enable CONFIG_NOMOUNT
        make O=kernel/out ARCH=arm64 olddefconfig
