name: Build kernel
description: Build the Xiaomi Flourite tree directly with Kbuild
inputs:
  jobs:
    required: true
    default: '0'
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}/kernel
      env:
        BUILD_JOBS: ${{ inputs.jobs }}
      run: |
        set -euxo pipefail
        export ARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        export READELF=llvm-readelf
        export HOSTCC=clang
        export HOSTCXX=clang++
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-

        rm -rf out
        mkdir -p out
        make O=out ARCH=arm64 gki_defconfig
        scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/flourite_GKI.config
        make O=out ARCH=arm64 olddefconfig

        jobs="$BUILD_JOBS"
        [ "$jobs" = 0 ] && jobs="$(nproc)"
        make O=out ARCH=arm64 -j"$jobs" Image modules dtbs

        test -s out/arch/arm64/boot/Image
        mkdir -p ../build-info ../AnyKernel3
        cp out/arch/arm64/boot/Image ../AnyKernel3/Image
        find out/arch/arm64/boot -maxdepth 1 -type f \( -name 'Image*' -o -name '*.dtb' \) -exec cp -f {} ../AnyKernel3/ \; || true
        find out -type f -name '*.ko' -exec cp -f {} ../AnyKernel3/ \; || true
        cp out/.config ../build-info/config
        make O=out kernelversion | tee ../build-info/kernel-version
        git rev-parse HEAD | tee ../build-info/source-commit
        git status --short | tee ../build-info/source-status
