name: Build Flourite Kernel
description: Build the Xiaomi Flourite OSS kernel directly with Kbuild

inputs:
  config:
    description: 'Flourite config fragment'
    required: false
    default: 'flourite_GKI.config'

runs:
  using: composite
  steps:
    - name: Prepare Flourite configuration
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        # Kbuild requires the source tree to be free of generated files for
        # an out-of-tree build. Feature integration may have created generated
        # files before this point, so clean generated state without reverting
        # the actual Xiaomi/KSU/SUSFS source changes.
        make ARCH=arm64 mrproper
        rm -rf out
        mkdir -p out

        # Start from the kernel's own GKI baseline, then merge Xiaomi's
        # Flourite-specific configuration. Do not use Android Common/GKI repos.
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
        ./scripts/kconfig/merge_config.sh -m -r \
          out/.config \
          "arch/arm64/configs/vendor/${{ inputs.config }}"

        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
        grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_SUSFS|CONFIG_NOMOUNT|CONFIG_BBG)=' out/.config || true

    - name: Build Image and modules
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        export ARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export KBUILD_BUILD_TIMESTAMP="${KBUILD_BUILD_TIMESTAMP:-Wed May 21 08:05:54 UTC 2025}"
        export SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-1747814754}"

        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" \
          Image Image.gz Image.lz4 modules dtbs

    - name: Gather artifacts
      shell: bash
      run: |
        set -euo pipefail
        AK="${{ github.workspace }}/AnyKernel3"
        rm -rf "$AK"
        mkdir -p "$AK"

        found=0
        for f in \
          "${{ github.workspace }}/kernel/out/arch/arm64/boot/Image" \
          "${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz" \
          "${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.lz4"; do
          if [ -f "$f" ]; then
            cp "$f" "$AK/$(basename "$f")"
            found=1
          fi
        done

        if [ "$found" -eq 0 ]; then
          echo "::error::No kernel Image was produced"
          exit 1
        fi

        cp "${{ github.workspace }}/kernel/out/.config" "$AK/kernel.config"
        find "${{ github.workspace }}/kernel/out/arch/arm64/boot/dts" \
          -type f \( -name '*.dtb' -o -name '*.dtbo' \) \
          -exec cp --parents {} "$AK/" \; 2>/dev/null || true

        {
          echo "# Flourite Kernel Build"
          echo
          echo "- Source: \`${SOURCE_REPO}\`"
          echo "- Branch: \`${SOURCE_BRANCH}\`"
          echo "- Commit: \`${SOURCE_COMMIT}\`"
          echo "- Kernel: \`${SOURCE_KERNEL_VERSION}\`"
          echo "- KSU: \`${KSU_VERSION:-N/A}\`"
          echo "- KSU tag: \`${KSU_GIT_TAG:-N/A}\`"
          echo "- KSU commit: \`${KSU_COMMIT:-N/A}\`"
          echo
          echo '```text'
          strings "$AK/Image" 2>/dev/null | grep -m1 '^Linux version ' || true
          echo '```'
        } > "$AK/build-info.md"
