name: Baseband Guard
description: Integrate BBG without assuming an ACK common/ directory
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euxo pipefail
        curl --fail --location --proto '=https' -LSs \
          https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
        test -d Baseband-guard
        if grep -Rqs 'baseband_guard' security; then
          echo 'BBG sources detected in security/'
        elif grep -Rqs 'baseband_guard' . --exclude-dir=.git --exclude-dir=out; then
          echo 'BBG sources detected'
        else
          echo '::error::BBG setup completed but baseband_guard was not found'
          exit 1
        fi
        if grep -q '^config LSM$' security/Kconfig; then
          if grep -q 'baseband_guard' security/Kconfig; then
            true
          else
            sed -i '/^[[:space:]]*default .*selinux/ { /baseband_guard/! s/selinux/selinux,baseband_guard/; }' security/Kconfig || true
          fi
        fi
        scripts/config --enable CONFIG_BBG || true
        make O=out ARCH=arm64 olddefconfig
