name: Set Kernel Config
description: Update the Flourite vendor config fragment

inputs:
  config_list:
    required: true
    description: "Kernel config lines"

runs:
  using: composite
  steps:
    - name: Patch Flourite config fragment
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        DEFCONFIG="arch/arm64/configs/vendor/flourite_GKI.config"
        [ -f "$DEFCONFIG" ] || { echo "::error::$DEFCONFIG not found"; exit 1; }

        apply_line() {
          local line key value
          line="$(echo "$1" | xargs)"
          [[ -z "$line" || "$line" == \#* ]] && return 0

          if [[ "$line" == *"="* ]]; then
            key="${line%%=*}"
            value="${line#*=}"
          else
            key="$line"
            value="y"
          fi

          if grep -q "^${key}=" "$DEFCONFIG"; then
            sed -i "s|^${key}=.*|${key}=${value}|" "$DEFCONFIG"
          elif grep -q "^# ${key} is not set" "$DEFCONFIG"; then
            sed -i "s|^# ${key} is not set|${key}=${value}|" "$DEFCONFIG"
          else
            printf '%s=%s\n' "$key" "$value" >> "$DEFCONFIG"
          fi
        }

        while IFS= read -r line || [ -n "$line" ]; do
          apply_line "$line"
        done <<< "${{ inputs.config_list }}"

        echo "Updated $DEFCONFIG"
