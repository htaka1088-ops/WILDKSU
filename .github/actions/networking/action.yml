name: Networking
description: Enable networking features that are native to the Flourite 6.1 tree; no 5.15 BBRv3 backport
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euxo pipefail
        # Do not apply the old 5.15/6.12 BBRv3 patches from the previous .github.
        # Linux 6.1 already contains BBR and the required qdisc infrastructure.
        for cfg in \
          CONFIG_INET \
          CONFIG_TCP_CONG_BBR \
          CONFIG_NET_SCH_FQ \
          CONFIG_NET_SCH_FQ_CODEL \
          CONFIG_NET_CLS_ACT \
          CONFIG_NET_CLS_BPF \
          CONFIG_NET_CLS_CGROUP \
          CONFIG_IP_SET \
          CONFIG_IP_SET_MAX \
          CONFIG_WIREGUARD; do
          scripts/config --enable "$cfg" || true
        done
        scripts/config --enable CONFIG_CIFS || true
        scripts/config --enable CONFIG_CIFS_XATTR || true
        scripts/config --enable CONFIG_CIFS_POSIX || true
        make O=out ARCH=arm64 olddefconfig
